<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0618" />
    <meta name="description" content="Happy Birthday Jacqueline Veronica — A cinematic birthday experience crafted with love." />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Happy Birthday, Jacqueline Veronica ✨" />
    <meta property="og:description" content="A cinematic birthday experience — just for JRD." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/og-preview.jpg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Happy Birthday, Jacqueline Veronica ✨</title>
    <!-- Apple Emoji Parser -->
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        function parseAppleEmojis(rootNode) {
          if (window.twemoji) {
            window.twemoji.parse(rootNode || document.body, {
              callback: function(icon) {
                var cleanIcon = icon.replace(/-fe0f/g, '');
                return 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.0.1/img/apple/64/' + cleanIcon + '.png';
              },
              className: 'apple-emoji'
            });
          }
        }

        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList') {
              mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1 || node.nodeType === 3) {
                  var parent = node.nodeType === 3 ? node.parentElement : node;
                  if (parent && parent.tagName !== 'IMG' && !parent.classList.contains('apple-emoji')) {
                    parseAppleEmojis(parent);
                  }
                }
              });
            } else if (mutation.type === 'characterData') {
              if (mutation.target.parentElement && !mutation.target.parentElement.classList.contains('apple-emoji')) {
                parseAppleEmojis(mutation.target.parentElement);
              }
            }
          });
        });

        document.addEventListener('DOMContentLoaded', function() {
          parseAppleEmojis();
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });

        window.addEventListener('load', function() {
          parseAppleEmojis();
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true, characterData: true });
          }
        });
      })();
    </script>
  </body>
</html>
